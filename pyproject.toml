[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "change-consequence-engine"
version = "0.1.0"
description = "Multi-agent evidence analysis for discovering latent consequences of organizational change"
readme = "README.md"
requires-python = ">=3.12"

# Runtime dependencies are deliberately minimal. No vendor LLM SDK is required:
# every provider is reached over HTTP through the gateway (see docs/ARCHITECTURE.md 11).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
]

[project.optional-dependencies]
# Postgres driver kept optional so the test suite installs on interpreters that do not
# yet have a psycopg binary wheel. Required for migrations and any real DB work.
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.isort]
# Without this, `app` and `tests` are treated as third-party and sorted into the wrong
# block, which fights the autofixer on every run.
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Adapter tests reach into `_base_url` to assert URL normalisation.
"tests/unit/test_providers.py" = ["E501", "SLF001"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises the FastAPI app or external infrastructure",
    "contract: asserts an architectural or schema contract",
    "requires_provider: needs real provider credentials; skipped by default",
]
